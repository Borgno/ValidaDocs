version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: validadocs-app
    expose:
      - "${FRONT_PORT:-3000}"
    environment:
      - RUNNING_IN_DOCKER=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:${POSTGRES_PORT:-3002}/${POSTGRES_DB:-validadocs}?schema=public
      - REDIS_URL=redis://redis:${REDIS_PORT:-3003}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-3004}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-validadocs}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - PORT=${FRONT_PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: validadocs-db
    command: postgres -p ${POSTGRES_PORT:-3002}
    expose:
      - "${POSTGRES_PORT:-3002}"
    environment:
      - PGPORT=${POSTGRES_PORT:-3002}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-validadocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: validadocs-redis
    command: redis-server --port ${REDIS_PORT:-3003}
    expose:
      - "${REDIS_PORT:-3003}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_PORT:-3003} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: validadocs-minio
    command: server /data --address ":${MINIO_PORT:-3004}" --console-address ":${MINIO_CONSOLE_PORT:-3005}"
    expose:
      - "${MINIO_PORT:-3004}"
      - "${MINIO_CONSOLE_PORT:-3005}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-admin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT:-3004}/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped



volumes:
  postgres_data:
  redis_data:
  minio_data:
