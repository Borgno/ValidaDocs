# Infra local para desenvolvimento: Postgres, Redis e MinIO. A app roda no host com `bun run dev`.
# Produção sobe tudo pelo docker-compose.yml.
# Uso: bun run infra:up
name: validadocs-dev

services:
  db:
    # Mesma versão de produção (Postgres 16).
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: validadocs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports:
      - "127.0.0.1:9000:9000"
      # Console web do MinIO.
      - "127.0.0.1:9001:9001"
    volumes:
      # Persiste junto com o banco: as telas apagam o registro cujo arquivo sumiu do MinIO.
      - minio_dev_data:/data

volumes:
  postgres_dev_data:
  minio_dev_data:
